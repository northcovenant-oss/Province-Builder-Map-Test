<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Claim Your Lands</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap');

:root{
  --parchment: #ece0c2;
  --parchment-dark: #ddcda3;
  --ink: #2c2417;
  --ink-soft: #4a3f2c;
  --gold: #b8862c;
  --gold-bright: #e0a83e;
  --seal-red: #7a2424;
  --water: #6f97a8;
  --line: rgba(44,36,23,0.35);
  --panel-bg: #f4ead0;
}

*{ box-sizing:border-box; }

html,body{
  margin:0; padding:0; height:100%;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,255,255,0.35), transparent 40%),
    radial-gradient(ellipse at 80% 85%, rgba(0,0,0,0.12), transparent 45%),
    var(--parchment);
  font-family: 'Crimson Text', serif;
  color: var(--ink);
  overflow:hidden;
}

.app{
  display:flex;
  height:100vh;
  width:100vw;
}

/* ---------- MAP SIDE ---------- */
.map-wrap{
  flex: 1 1 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  min-width:0;
}

.map-frame{
  position:relative;
  width:100%;
  height:100%;
  border:2px solid var(--ink);
  outline: 1px solid var(--gold);
  outline-offset: 5px;
  border-radius:4px;
  background: var(--parchment-dark);
  box-shadow: 0 20px 60px rgba(0,0,0,0.35), inset 0 0 80px rgba(80,60,20,0.15);
  overflow:hidden;
}

.map-frame svg{
  width:100%;
  height:100%;
  display:block;
  cursor: default;
}

.title-block{
  position:absolute;
  top:16px;
  left:24px;
  z-index:5;
  pointer-events:none;
  background: linear-gradient(120deg, rgba(236,224,194,0.92), rgba(236,224,194,0.55) 70%, transparent);
  padding:10px 18px 12px 4px;
  border-radius: 0 0 8px 0;
}
.title-block h1{
  font-family:'Cinzel', serif;
  font-weight:700;
  font-size:22px;
  letter-spacing:1.5px;
  margin:0;
  color: var(--ink);
  text-shadow: 0 1px 0 rgba(255,255,255,0.4);
}
.title-block p{
  margin:4px 0 0;
  font-size:14px;
  font-style:italic;
  color: var(--ink-soft);
}

path.province{
  cursor: pointer;
  stroke: var(--ink);
  stroke-width: 0.6;
  transition: filter 0.15s ease, opacity 0.15s ease;
}
path.province:hover{
  filter: brightness(1.18) saturate(1.15);
}
path.province.selected{
  stroke: var(--gold-bright);
  stroke-width: 1.6;
  filter: saturate(1.3) brightness(1.05);
}
path.water{
  fill: var(--water);
  stroke: rgba(44,36,23,0.25);
  stroke-width: 0.4;
  opacity:0.75;
  cursor: not-allowed;
}

.seal{
  pointer-events:none;
}
.seal circle{
  fill: var(--seal-red);
  stroke: var(--gold-bright);
  stroke-width: 0.5;
}
.seal text{
  fill: var(--parchment);
  font-family:'Cinzel', serif;
  font-weight:700;
  text-anchor:middle;
  dominant-baseline:central;
}

.tooltip{
  position:absolute;
  pointer-events:none;
  background: var(--ink);
  color: var(--parchment);
  font-family:'Crimson Text', serif;
  font-size:14px;
  padding:5px 10px;
  border-radius:3px;
  border:1px solid var(--gold);
  transform: translate(-50%, -130%);
  white-space:nowrap;
  z-index:20;
  opacity:0;
  transition: opacity 0.1s ease;
}
.tooltip.show{ opacity:1; }
.tooltip .sub{ color: var(--gold-bright); font-size:12px; font-style:italic; }

/* ---------- SIDE PANEL ---------- */
.panel{
  flex: 0 0 340px;
  background: var(--panel-bg);
  border-left: 2px solid var(--ink);
  display:flex;
  flex-direction:column;
  padding:26px 22px;
  min-width:0;
}

.panel h2{
  font-family:'Cinzel', serif;
  font-size:19px;
  letter-spacing:1px;
  margin:0 0 4px;
  color:var(--ink);
}
.panel .desc{
  font-size:14px;
  color:var(--ink-soft);
  font-style:italic;
  margin:0 0 18px;
  line-height:1.4;
}

.counter-row{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:10px 2px;
  margin-bottom:14px;
}
.counter-row .num{
  font-family:'Cinzel', serif;
  font-size:26px;
  color: var(--seal-red);
}
.counter-row .of{
  font-size:15px;
  color:var(--ink-soft);
}
.counter-row .label{
  font-size:13px;
  letter-spacing:0.5px;
  text-transform:uppercase;
  color:var(--ink-soft);
}

.selected-list{
  flex:1 1 auto;
  overflow-y:auto;
  margin: 0 -6px;
  padding: 0 6px;
}
.selected-list::-webkit-scrollbar{ width:8px; }
.selected-list::-webkit-scrollbar-thumb{ background: var(--gold); border-radius:4px; }

.empty-state{
  text-align:center;
  color: var(--ink-soft);
  font-style:italic;
  font-size:14px;
  margin-top:40px;
  line-height:1.6;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  margin-bottom:6px;
  background: rgba(255,255,255,0.35);
  border:1px solid var(--line);
  border-radius:3px;
  animation: itemIn 0.18s ease;
}
@keyframes itemIn{
  from{ opacity:0; transform: translateX(6px); }
  to{ opacity:1; transform: translateX(0); }
}
.item .order{
  font-family:'Cinzel', serif;
  font-size:12px;
  width:20px; height:20px;
  border-radius:50%;
  background: var(--seal-red);
  color: var(--parchment);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.item .swatch{
  width:12px; height:12px;
  border-radius:2px;
  border:1px solid var(--ink);
  flex-shrink:0;
}
.item .name{
  flex:1 1 auto;
  font-size:14.5px;
  color:var(--ink);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.item .remove{
  background:none;
  border:none;
  color: var(--ink-soft);
  cursor:pointer;
  font-size:16px;
  line-height:1;
  padding:2px 4px;
  opacity:0.6;
}
.item .remove:hover{ opacity:1; color:var(--seal-red); }

.panel-actions{
  padding-top:14px;
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
}

button.btn{
  font-family:'Cinzel', serif;
  letter-spacing:0.5px;
  font-size:13.5px;
  padding:11px 14px;
  border-radius:3px;
  border:1px solid var(--ink);
  cursor:pointer;
  transition: transform 0.08s ease, filter 0.15s ease;
}
button.btn:active{ transform: translateY(1px); }

button.btn-clear{
  background: transparent;
  color: var(--ink-soft);
  flex:0 0 auto;
}
button.btn-clear:hover{ background: rgba(0,0,0,0.05); }

button.btn-generate{
  background: linear-gradient(180deg, var(--gold-bright), var(--gold));
  color: var(--ink);
  flex:1 1 auto;
  box-shadow: 0 2px 0 rgba(0,0,0,0.25);
}
button.btn-generate:hover:not(:disabled){ filter:brightness(1.06); }
button.btn-generate:disabled{
  background: #cfc4a4;
  color: #8a8064;
  cursor:not-allowed;
  box-shadow:none;
}

.limit-msg{
  font-size:13px;
  color: var(--seal-red);
  text-align:center;
  height:18px;
  margin-top:8px;
  opacity:0;
  transition: opacity 0.2s ease;
}
.limit-msg.show{ opacity:1; }

@media (max-width: 820px){
  .app{ flex-direction:column-reverse; }
  .panel{ flex-basis:auto; height:42vh; border-left:none; border-top:2px solid var(--ink); }
  .map-wrap{ height:58vh; padding:14px; }
}
</style>
</head>
<body>

<div class="app">
  <div class="map-wrap">
    <div class="map-frame" id="mapFrame">
      <div class="title-block">
        <h1>Claim Your Lands</h1>
        <p>Select up to 20 provinces to shape your land bio</p>
      </div>
      <svg id="mapSvg" viewBox="3413 706 542 425" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="tooltip" id="tooltip"></div>
    </div>
  </div>

  <div class="panel">
    <h2>Your Claimed Territory</h2>
    <p class="desc">Click provinces on the map to claim them. Water is not selectable.</p>

    <div class="counter-row">
      <div><span class="num" id="countNum">0</span><span class="of">&nbsp;/ 20</span></div>
      <div class="label">Provinces Claimed</div>
    </div>

    <div class="selected-list" id="selectedList">
      <div class="empty-state" id="emptyState">No provinces claimed yet.<br>Click the map to begin.</div>
    </div>

    <div class="limit-msg" id="limitMsg">20 claimed — remove one to add another</div>

    <div class="panel-actions">
      <button class="btn btn-clear" id="clearBtn">Clear All</button>
      <button class="btn btn-generate" id="generateBtn" disabled>Generate Land Bio</button>
    </div>
  </div>
</div>

96,-0.082 -0.71497,-0.082 -0.1734,-0.5463 -0.17339,-0.5463 -1.88976,0.1761 -1.88977,0.1761 -0.79375,-0.011 -0.79375,-0.011 -0.66146,-0.2957 -0.66145,-0.2958 -0.70229,-0.3646 -0.70228,-0.3646 h -0.68016 -0.68017 l 0.15862,-0.7931 0.15862,-0.7931 -0.32992,-0.3976 -0.32993,-0.3975 h -1.02593 -1.02594 v -0.3969 -0.3968 h -0.39687 -0.39688 l -0.50764,-0.5077 -0.50764,-0.5076 0.44841,-0.4058 0.4484,-0.4058 1.18372,-0.1587 1.18371,-0.1588 0.85989,-0.1304 0.8599,-0.1305 v -0.3207 -0.3208 l 1.8657,-0.4201 1.86569,-0.4202 0.32856,0.4691 0.32855,0.4691 1.0469,0.085 1.04689,0.085 0.0846,0.5953 0.0846,0.5954 h 0.64305 0.64306 v 0.5129 0.513 l 1.16089,0.174 1.16089,0.1741 0.62505,-0.3652 0.62505,-0.3652 1.31427,0.018 1.31426,0.018 0.53753,1.1153 0.53753,1.1153 h 0.96204 0.96205 l 0.4273,0.6521 0.42731,0.6522 v 0.8459 0.846 l 0.66976,1.1428 0.66976,1.1429 0.45913,0.2457 0.45913,0.2457 0.34381,1.016 0.3438,1.0159 0.29181,0.5953 0.2918,0.5953 h 0.48972 0.48971 l 1.04782,-0.6615 1.04782,-0.6614 h 0.66671 0.66672 v 0.5481 0.548 l 0.37797,0.378 0.37798,0.378 h 0.28348 0.28349 v 0.4655 0.4655 l -0.52917,0.3305 -0.52917,0.3305 v 0.5647 0.5647 l -2.64583,-0.1822 -2.64584,-0.1822 v 0.2767 0.2767 z", "fill": "#3599d1", "group": "Water", "label": "Water 29"}];

<script>
(function(){
  const MAX_SELECT = 20;
  const svg = document.getElementById('mapSvg');
  const tooltip = document.getElementById('tooltip');
  const mapFrame = document.getElementById('mapFrame');
  const countNum = document.getElementById('countNum');
  const selectedList = document.getElementById('selectedList');
  const emptyState = document.getElementById('emptyState');
  const limitMsg = document.getElementById('limitMsg');
  const clearBtn = document.getElementById('clearBtn');
  const generateBtn = document.getElementById('generateBtn');

  const NS = 'http://www.w3.org/2000/svg';
  const g = document.createElementNS(NS, 'g');
  g.setAttribute('transform', GROUP_TRANSFORM);
  svg.appendChild(g);

  // selection order: array of province ids, in click order
  let selected = [];

  // Render water first (background, non-interactive)
  WATER.forEach(function(w){
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', w.d);
    el.setAttribute('class', 'water');
    g.appendChild(el);
  });

  // Render provinces (interactive)
  const provinceEls = {};
  PROVINCES.forEach(function(p){
    const el = document.createElementNS(NS, 'path');
    el.setAttribute('d', p.d);
    el.setAttribute('class', 'province');
    el.setAttribute('fill', p.fill);
    el.dataset.id = p.id;
    el.addEventListener('click', function(){ toggleProvince(p.id); });
    el.addEventListener('mousemove', function(e){ showTooltip(e, p); });
    el.addEventListener('mouseleave', hideTooltip);
    g.appendChild(el);
    provinceEls[p.id] = el;
  });

  const byId = {};
  PROVINCES.forEach(function(p){ byId[p.id] = p; });

  function showTooltip(e, p){
    const rect = mapFrame.getBoundingClientRect();
    tooltip.innerHTML = p.label + (selected.indexOf(p.id) !== -1 ? '<div class="sub">Claimed \u2014 click to release</div>' : '<div class="sub">Click to claim</div>');
    tooltip.style.left = (e.clientX - rect.left) + 'px';
    tooltip.style.top = (e.clientY - rect.top) + 'px';
    tooltip.classList.add('show');
  }
  function hideTooltip(){ tooltip.classList.remove('show'); }

  function flashLimit(){
    limitMsg.classList.add('show');
    setTimeout(function(){ limitMsg.classList.remove('show'); }, 1600);
  }

  function toggleProvince(id){
    const idx = selected.indexOf(id);
    if(idx !== -1){
      selected.splice(idx, 1);
    } else {
      if(selected.length >= MAX_SELECT){
        flashLimit();
        return;
      }
      selected.push(id);
    }
    render();
  }

  function removeProvince(id){
    const idx = selected.indexOf(id);
    if(idx !== -1){ selected.splice(idx,1); render(); }
  }

  function render(){
    // update map highlighting
    Object.keys(provinceEls).forEach(function(id){
      provinceEls[id].classList.toggle('selected', selected.indexOf(id) !== -1);
    });

    // seals (order badges) - remove old, redraw
    Array.from(g.querySelectorAll('.seal')).forEach(function(n){ n.remove(); });
    selected.forEach(function(id, i){
      const p = byId[id];
      const c = centroid(p.d);
      if(!c) return;
      const seal = document.createElementNS(NS, 'g');
      seal.setAttribute('class', 'seal');
      const r = 5.2;
      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', c.x); circle.setAttribute('cy', c.y); circle.setAttribute('r', r);
      const text = document.createElementNS(NS, 'text');
      text.setAttribute('x', c.x); text.setAttribute('y', c.y);
      text.setAttribute('font-size', '6.5');
      text.textContent = (i+1);
      seal.appendChild(circle);
      seal.appendChild(text);
      g.appendChild(seal);
    });

    // counter
    countNum.textContent = selected.length;

    // list
    selectedList.innerHTML = '';
    if(selected.length === 0){
      selectedList.appendChild(emptyState);
    } else {
      selected.forEach(function(id, i){
        const p = byId[id];
        const item = document.createElement('div');
        item.className = 'item';
        item.innerHTML =
          '<div class="order">'+(i+1)+'</div>' +
          '<div class="swatch" style="background:'+p.fill+'"></div>' +
          '<div class="name">'+p.label+'</div>' +
          '<button class="remove" title="Release province">\u2715</button>';
        item.querySelector('.remove').addEventListener('click', function(){ removeProvince(id); });
        selectedList.appendChild(item);
      });
    }

    generateBtn.disabled = selected.length === 0;
  }

  clearBtn.addEventListener('click', function(){
    selected = [];
    render();
  });

  generateBtn.addEventListener('click', function(){
    const names = selected.map(function(id){ return byId[id].label; });
    alert('Ready to generate a land bio for:\n\n' + names.join('\n') + '\n\n(Hook this button up to your land-bio generator.)');
  });

  // crude centroid approximation from path 'd' — averages all coordinate points
  function centroid(d){
    const nums = d.match(/-?\d*\.?\d+(?:e-?\d+)?/g);
    if(!nums) return null;
    // walk tokens the same way the path is drawn is overkill for a label point;
    // instead take a simple average of all M/L absolute-ish coordinates by
    // reconstructing positions with a lightweight state machine.
    const tokens = d.match(/[MmLlHhVvCcSsQqTtAaZz]|-?\d*\.?\d+(?:e-?\d+)?/g);
    let i=0, cmd=null, cx=0, cy=0, sx=0, sy=0;
    const pts = [];
    function num(){ return parseFloat(tokens[i++]); }
    while(i < tokens.length){
      const t = tokens[i];
      if(/[MmLlHhVvCcSsQqTtAaZz]/.test(t)){ cmd = t; i++; }
      switch(cmd){
        case 'M': cx=num(); cy=num(); sx=cx; sy=cy; pts.push([cx,cy]); cmd='L'; break;
        case 'm': cx+=num(); cy+=num(); sx=cx; sy=cy; pts.push([cx,cy]); cmd='l'; break;
        case 'L': cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 'l': cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'H': cx=num(); pts.push([cx,cy]); break;
        case 'h': cx+=num(); pts.push([cx,cy]); break;
        case 'V': cy=num(); pts.push([cx,cy]); break;
        case 'v': cy+=num(); pts.push([cx,cy]); break;
        case 'C': num();num();num();num(); cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 'c': num();num();num();num(); cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'S': num();num(); cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 's': num();num(); cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'Q': num();num(); cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 'q': num();num(); cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'T': cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 't': cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'A': num();num();num();num();num(); cx=num(); cy=num(); pts.push([cx,cy]); break;
        case 'a': num();num();num();num();num(); cx+=num(); cy+=num(); pts.push([cx,cy]); break;
        case 'Z': case 'z': cx=sx; cy=sy; break;
        default: i++;
      }
    }
    if(pts.length===0) return null;
    let sxs=0, sys=0;
    pts.forEach(function(pt){ sxs+=pt[0]; sys+=pt[1]; });
    return { x: sxs/pts.length, y: sys/pts.length };
  }

  render();
})();

</script>
